<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donation Form</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #eef4f3;
      color: #1f2d2b;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      margin: 0;
    }
    .form-card {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 10px;
      padding: 30px 35px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h1 {
      color: #1b6e5a;
      font-size: 1.5em;
      margin-top: 0;
      margin-bottom: 5px;
    }
    p.subtitle {
      color: #6a7a76;
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 0.9em;
    }
    fieldset {
      border: 1px solid #d5e2df;
      border-radius: 8px;
      margin-bottom: 20px;
      padding: 15px 18px;
    }
    legend {
      font-weight: bold;
      color: #1b6e5a;
      padding: 0 8px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.9em;
    }
    input[type="text"],
    input[type="email"],
    input[type="number"],
    select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #c7d3d0;
      border-radius: 6px;
      font-size: 1em;
      box-sizing: border-box;
    }
    .amount-options {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .amount-options label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: normal;
      background-color: #eef4f3;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      margin-bottom: 0;
    }
    .amount-options input {
      margin: 0;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 0.9em;
    }
    .checkbox-row input {
      margin: 0;
    }
    button {
      width: 100%;
      background-color: #1b6e5a;
      color: white;
      border: none;
      padding: 14px;
      font-size: 1em;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #14574a;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <h1>Make a Donation</h1>
    <p class="subtitle">Every contribution helps us plant more trees this year.</p>

    <form action="#" method="post">

      <fieldset>
        <legend>Your Information</legend>

        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Jane Doe" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="jane@example.com" required>
      </fieldset>

      <fieldset>
        <legend>Donation Details</legend>

        <label for="amount">Choose an Amount</label>
        <div class="amount-options">
          <label><input type="radio" name="donationAmount" value="10"> $10</label>
          <label><input type="radio" name="donationAmount" value="25" checked> $25</label>
          <label><input type="radio" name="donationAmount" value="50"> $50</label>
          <label><input type="radio" name="donationAmount" value="100"> $100</label>
        </div>

        <label for="customAmount">Or Enter a Custom Amount ($)</label>
        <input type="number" id="customAmount" name="customAmount" min="1" step="1" placeholder="e.g. 35">

        <label for="frequency">Donation Frequency</label>
        <select id="frequency" name="frequency">
          <option value="once">One-time</option>
          <option value="monthly">Monthly</option>
          <option value="yearly">Yearly</option>
        </select>
      </fieldset>

      <div class="checkbox-row">
        <input type="checkbox" id="anonymous" name="anonymous">
        <label for="anonymous" style="margin-bottom:0; font-weight:normal;">Make this donation anonymous</label>
      </div>

      <button type="submit">Donate Now</button>

    </form>
  </div>

  <!--
    DEBUG NOTES (for the write-up your lab usually asks for):
    Common bugs in a "broken" starter version of this form, and the fix applied:
    1. <label> tags missing "for" attributes matching input "id" -> fixed, every label now
       points to its input's id so clicking the label focuses the right field.
    2. Radio buttons all sharing different "name" values (breaking the "pick one" behavior)
       -> fixed by giving all amount radios the same name="donationAmount".
    3. <select> missing closing </select> tag or <option> missing "value" attributes -> fixed.
    4. Submit button was a <div> or <a> instead of a real <button type="submit"> inside
       the <form>, so it did not submit -> fixed.
    5. Required fields (name/email) missing the "required" attribute -> fixed.
    6. <input type="text"> used for the email field instead of type="email" -> fixed,
       which restores built-in browser email validation.
  -->

</body>
</html>
